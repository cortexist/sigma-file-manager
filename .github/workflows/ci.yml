name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# There is deliberately no Windows job. The Windows build does not compile here and has not for
# some time: `audio_covers` — and the rest of the native media stack — uses GStreamer, which
# `Cargo.toml` declares for Linux only, while the modules themselves are not gated. Fixing that
# would mean maintaining Windows code this fork does not ship, run or test. The `#[cfg(windows)]`
# code that remains is inherited and unverified; treat it as such rather than trusting CI to
# have checked it.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Volta
        uses: volta-cli/action@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Pack API package
        run: npm pack --dry-run ./packages/api

      - name: Type check
        run: npm run ts

      - name: Lint
        run: npm run lint:check

      - name: Test
        run: npm run test

  tauri-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        uses: ./.github/actions/install-linux-tauri-deps

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo test (lib)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
